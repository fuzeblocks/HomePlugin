# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and publish to GitHub Packages
        run: mvn -B deploy -s $GITHUB_WORKSPACE/settings.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attach jars to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            profiles/legacy/target/legacy-*.jar
            profiles/modern-26.1.x/target/modern-*.jar
            profiles/modern-26.2/target/modern-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
