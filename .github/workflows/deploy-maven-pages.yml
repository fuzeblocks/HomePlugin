# Deploy generated Javadoc (Core, Legacy, Modern) to GitHub Pages
name: Deploy Javadoc to Pages

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Build all modules (core, legacy, modern)
        run: mvn -B install -DskipTests

      - name: Generate aggregated Javadoc
        run: >
          mvn -B org.apache.maven.plugins:maven-javadoc-plugin:3.4.0:aggregate
          -DreportOutputDirectory=${{ github.workspace }}/target/site
          -DdestDir=apidocs

      - name: Publish Javadoc to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/apidocs
          destination_dir: apidocs
          keep_files: true